name: Dependency audit

# Known-vulnerability scan of uv.lock (pip-audit) and the npm lockfiles (npm audit), JAN-268.
# Runs daily on main, because advisories appear without any code change. On pull requests
# ci.yml calls it when a dependency definition, the audit or its policy changes
# (scripts/ci_paths.py, JAN-313). It only reports and blocks; fixes are reviewed lockfile
# changes. Policy: docs/docs/tech-spec/auth-security.md.

on:
  workflow_call: {}
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Set up UV
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.22.2"
      - name: Set up Task
        uses: go-task/setup-task@v2
      - name: Audit dependencies
        run: task audit:deps -- --json dependency-audit.json
      - name: Upload audit report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: dependency-audit
          path: dependency-audit.json
          if-no-files-found: ignore
          retention-days: 14
