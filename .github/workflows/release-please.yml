name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Manifest mode: release-please-config.json and .release-please-manifest.json
      # at the repo root. The config also bumps the janus entry in uv.lock (JAN-290),
      # which the plain `release-type: python` mode cannot do.
      - uses: googleapis/release-please-action@v5
        id: release

  build-and-release-artifacts:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      # The frontend is built first: the wheel carries it (hatch_build.py), and the self-hosted
      # auto-update of a git checkout (services/update_service.py) installs it from the
      # janus-frontend-dist.tar.gz asset, so no install needs Node.js. The updater checks the
      # SHA-256 digest GitHub records for each asset.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
      - name: Build artifacts
        run: |
          set -euo pipefail
          uv build
          tar -C frontend/dist -czf dist/janus-frontend-dist.tar.gz .
      - name: Smoke-test the wheel as a uv tool install
        run: scripts/wheel_smoke.sh --require-frontend --dist dist
      - name: Upload artifacts to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ needs.release-please.outputs.tag_name }} dist/*

  # Publishes the release to PyPI as janus-assistant (publish-pypi.yml). Off until the repository
  # variable PYPI_ENABLED is "true", set once pypi.org trusts this repository's workflows.
  publish-pypi:
    needs:
      - release-please
      - build-and-release-artifacts
    if: ${{ needs.release-please.outputs.release_created == 'true' && vars.PYPI_ENABLED == 'true' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-pypi.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}

  deploy-release:
    needs:
      - release-please
      - build-and-release-artifacts
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/deploy-uberspace.yml
    with:
      ref: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
