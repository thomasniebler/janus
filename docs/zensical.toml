# Zensical site configuration. The nav below is also the navigation of the
# in-app documentation (src/janus/services/docs_service.py), so keep it in
# reading order. It is excluded from toml-sort in prek.toml for that reason.

[project]
site_name = "Janus"
site_description = "Privacy-first, local-first personal AI agent."
site_author = "Thomas Niebler"
site_url = "https://thomasniebler.github.io/janus/"
copyright = "Copyright &copy; 2026 The authors"
nav = [
  {"Getting Started" = [
    {"Overview" = "index.md"},
    {"Quickstart" = "quickstart.md"},
    {"Configuration" = "configuration.md"}
  ]},
  {"Using Janus" = [
    {"Chat" = "chat.md"},
    {"Inbox and mail" = "inbox.md"},
    {"Triggers and automations" = "runtime-triggers.md"},
    {"Tools and permissions" = "tools.md"},
    {"Memory and knowledge" = "knowledge.md"},
    {"Planner" = "planner.md"},
    {"Integrations" = "integrations.md"},
    {"Desktop" = "desktop.md"},
    {"Operations" = "operations.md"}
  ]},
  {"Architecture" = "architecture.md"},
  {"Technical Spec" = [
    {"Overview" = "tech-spec.md"},
    {"Architecture Overview" = "tech-spec/architecture-overview.md"},
    {"Backend and API" = "tech-spec/backend-api.md"},
    {"Background Workers and Runtime" = "tech-spec/background-workers-runtime.md"},
    {"LLM and Agent Safety" = "tech-spec/llm-agent-safety.md"},
    {"Authentication and Security" = "tech-spec/auth-security.md"},
    {"Data Model and Migrations" = "tech-spec/data-model-migrations.md"},
    {"Frontend" = "tech-spec/frontend.md"},
    {"Mobile iOS" = "tech-spec/mobile-ios.md"},
    {"Deployment and Operations" = "tech-spec/deployment-operations.md"},
    {"Delivery Artifacts" = "tech-spec/delivery-artifacts.md"}
  ]},
  {"Planned Work" = [
    {"Overview" = "feature-specs/index.md"},
    {"Migrate to GitHub Issues" = "feature-specs/github-issues-migration.md"}
  ]},
  {"Changelog" = "changelog.md"}
]

[project.theme]
language = "en"
features = [
  "content.code.annotate",
  "content.code.copy",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight"
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"
