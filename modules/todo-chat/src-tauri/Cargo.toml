[build-dependencies]
tauri-build = {features = [], version = "2"}

[dependencies]
futures-util = "0.3"
http = "1"
keyring = {features = ["linux-native"], version = "3"}
reqwest = {default-features = false, features = ["cookies", "json", "rustls-tls", "stream"], version = "0.12"}
serde = {features = ["derive"], version = "1"}
serde_json = "1"
tauri = {features = [], version = "2"}
tauri-plugin-single-instance = "2"
tokio = {features = ["sync", "time"], version = "1"}
tokio-tungstenite = {features = ["rustls-tls-native-roots"], version = "0.26"}
toml = "0.8"
url = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]

[lib]
crate-type = ["cdylib", "rlib", "staticlib"]
name = "todo_chat_lib"

[package]
authors = ["Todo Chat"]
description = "A small resident Hyprland sidebar for Janus todos"
edition = "2021"
name = "todo-chat"
version = "0.1.0"
