fail_fast = false

[[repos]]
hooks = [
  {args = ["--branch", "main"], id = "no-commit-to-branch"},
  {exclude = '^frontend/src/generated/', id = "check-added-large-files"},
  {id = "check-toml"},
  {id = "check-yaml"},
  {id = "end-of-file-fixer"},
  {id = "trailing-whitespace"}
]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v5.0.0"

# Use local uv-provided ruff calls
[[repos]]
hooks = [
  {entry = "bash -c 'cd frontend && npm run knip:ci'", files = '^frontend/', id = "knip", language = "system", name = "Knip (dead code)", pass_filenames = false},
  {entry = "uv run deptry .", id = "deptry", language = "system", name = "Deptry (unused dependencies)", pass_filenames = false, types = ["python"]},
  {entry = "uv run ruff check --fix --force-exclude", id = "ruff-check", language = "system", name = "Ruff Check", types = ["python"]},
  {entry = "uv run ruff format --force-exclude", id = "ruff-format", language = "system", name = "Ruff Format", types = ["python"]},
  {entry = "uv run vulture", id = "vulture", language = "system", name = "Vulture (dead code)", pass_filenames = false, types = ["python"]}
]
repo = "local"

[[repos]]
hooks = [
  {exclude = '^frontend/src/generated/', id = "prettier", types_or = ["json", "yaml"]}
]
repo = "https://github.com/pre-commit/mirrors-prettier"
rev = "v3.1.0"

[[repos]]
hooks = [
  {args = ["--all", "--in-place"], files = '\.toml$', id = "toml-sort"}
]
repo = "https://github.com/pappasam/toml-sort"
rev = "v0.24.3"
